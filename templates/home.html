{% extends 'master.html' %}

{% block title %}
    Home
{% endblock %}

{% block body %}
    <div class="container">
        {% for product in products %}
            <h4>{{ product.name }}</h4>
            <p>Ksh {{ product.price }}</p>
            <p>{{ product.category }}</p>
            <a href="{% url 'edit' product.id %}" class="btn btn-info"><i class="bi bi-pencil-fill"></i></a>
            <a href="{% url 'delete' product.id %}" class="btn btn-danger"><i class="bi bi-calendar-x-fill"></i></a>
            <a href="{% url 'details' product.id %}" class="btn btn-dark">Details</a>
            <hr>
        {% endfor %}
    </div>
{% endblock %}
